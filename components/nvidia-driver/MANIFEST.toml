# NVIDIA userspace as an image volume (nvidia-driver.volume), for the
# moonshine and Steam containers. Adapted from corectl's Wolf stack.

[Settings]
# Runs rootless, as the moonshine account, through that account's own
# materia. moonshine-root calls forma, which creates the account.
User = "moonshine"

[[Services]]
Service = "nvidia-driver-volume.service"
Oneshot = true

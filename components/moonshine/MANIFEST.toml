# Moonshine, a Moonlight streaming server, with Steam as its one app.
# Adapted from corectl's moonshine.

[Settings]
# Runs rootless, as the moonshine account, through that account's own
# materia. The scripts call forma, which creates the account
# ([Forma.Accounts.moonshine] in the repository manifest).
User = "moonshine"
SetupScript = "moonshine-setup.sh"
PostScript = "moonshine-setup.sh"
CleanupScript = "moonshine-cleanup.sh"

[[Services]]
Service = "moonshine.service"

# Images, built by forma's builder, signed by its signer, loaded by the
# account. Each image a Quadlet names (Image=) must be built here.

[[Forma.Images]]
Tag = "moonshine/moonshine:patches"
Containerfile = "build/moonshine.Dockerfile"
Context = "build"
BuildArgs = { MOONSHINE_REPO = "https://github.com/skewballfox/moonshine.git", MOONSHINE_REF = "patches" }

[Forma.Images.Source]
Git = "https://github.com/skewballfox/moonshine.git"
Ref = "patches"
# The build argument that receives the commit forma resolved
CommitArg = "MOONSHINE_COMMIT"

[Forma.Images.Update]
Schedule = "daily"
Triggers = ["git-ref"]

# Steam. No Quadlet names this image: the launcher (/etc/moonshine/
# launch-steam) runs it when moonshine starts a session.
[[Forma.Images]]
Tag = "moonshine/steam:latest"
Containerfile = "build/steam.Dockerfile"
Context = "build"
# Takes moonshine's Vulkan WSI layer from the moonshine image
DependsOn = ["moonshine/moonshine:patches"]

[Forma.Images.Update]
Schedule = "weekly"

[[Forma.Images]]
Tag = "moonshine/xvfb:latest"
Containerfile = "build/xvfb.Dockerfile"
Context = "build"

[Forma.Images.Update]
Schedule = "weekly"

# PROPOSED KEYS, not in forma's extension yet: forma rejects them today. The
# forma-user library can already write both kinds of file.
#
# /dev/uinput, /dev/uhid and moonshine's pads to moonshine-input, and every
# virtual input device off the desktop seat. Forma installs each file under
# /etc/udev/rules.d/ and removes it with the component.
[Forma.Udev]
Rules = ["udev/85-moonshine.rules"]

# Loaded at boot through /etc/modules-load.d/, and now
[Forma.KernelModules]
Load = ["uinput", "uhid"]

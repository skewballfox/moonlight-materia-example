# Moonshine, a Moonlight streaming server, with Steam as its one app.
# Adapted from corectl's moonshine.

[Settings]
# Runs rootless, as the moonshine account, through that account's own
# materia. moonshine-root creates the account.
User = "moonshine"

[[Services]]
Service = "moonshine.service"

# No Quadlet names the Steam image, so nothing else starts its build
[[Services]]
Service = "steam-build.service"
Oneshot = true

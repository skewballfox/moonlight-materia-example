# Installed as /etc/systemd/user/moonshine-session.service.d/stop-steam.conf,
# owned by root (host/README.md). Only the moonshine account runs that unit.
# Drop-ins apply to transient units too, and override what moonshine sets.
#
# Moonshine gives its app unit TimeoutStopUSec=5s. Steam (with a game) can take
# longer to shut down, and Fedora's 10-timeout-abort.conf then SIGABRTs the whole
# unit, conmon included: podman is left listing a container nobody watches, the
# next launch's `podman stop` fails on it (exit 125), and moonlight gets a 503.
#
# Instead podman stops Steam itself, before systemd signals anything: SIGTERM
# (steam-entrypoint asks Steam to shut down), SIGKILL after 30 s, all through a
# live conmon, so its state stays consistent. podman run (ExecStart) then exits
# with the container.
#
# The unit's environment is moonshine's: podman needs the service user's runtime
# dir (%t) and no bus address from inside moonshine's container (as in launch-steam).
[Service]
ExecStop=/usr/bin/env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR=%t \
    /usr/bin/podman stop --ignore --time 30 moonshine-steam
# Covers ExecStop too: above podman's 30 s, so podman's own SIGKILL comes first
TimeoutStopSec=45
